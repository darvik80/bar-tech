<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">bar-tech architecture</title>
  <desc id="desc">Device bar-face, LAN with iot-platform and bar-core including RAG, Cloud OpenAI-compatible APIs</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dffe8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a6b62" stop-opacity="0.1"/>
    </linearGradient>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5eead4"/>
    </marker>
  </defs>

  <!-- Cogitor-like dark stage -->
  <rect width="1280" height="720" fill="#0a0a0a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Column frames (no page title — article heading covers that) -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <!-- Device -->
    <rect x="40" y="40" width="340" height="580" rx="10" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="40" y="40" width="340" height="36" rx="10" fill="#161616" stroke="#2a2a2a"/>
    <rect x="40" y="60" width="340" height="16" fill="#161616"/>
    <text x="56" y="64" fill="#e8a45a" font-size="13" font-weight="600" letter-spacing="0.08em">DEVICE</text>
    <text x="56" y="96" fill="#cfcfcf" font-size="15" font-weight="500">bar-face · ESP32-S3</text>

    <!-- Portrait placeholder frame (amber like Cogitor CV) -->
    <rect x="110" y="180" width="200" height="200" rx="8" fill="#151515" stroke="#e8a45a" stroke-width="1.5"/>
    <image href="barmen-idle-thumb.jpg" x="118" y="188" width="184" height="184" preserveAspectRatio="xMidYMid slice"/>

    <!-- chips -->
    <g font-size="12" fill="#eaeaea">
      <rect x="64" y="408" width="140" height="36" rx="6" fill="#1a1a1a" stroke="#333"/>
      <text x="134" y="430" text-anchor="middle">Wake word</text>
      <rect x="216" y="408" width="140" height="36" rx="6" fill="#1a1a1a" stroke="#333"/>
      <text x="286" y="430" text-anchor="middle">Opus UDP</text>
      <rect x="64" y="456" width="140" height="36" rx="6" fill="#1a1a1a" stroke="#333"/>
      <text x="134" y="478" text-anchor="middle">Display</text>
      <rect x="216" y="456" width="140" height="36" rx="6" fill="#1a1a1a" stroke="#333"/>
      <text x="286" y="478" text-anchor="middle">Pour</text>
    </g>

    <!-- LAN -->
    <rect x="420" y="100" width="440" height="520" rx="10" fill="#111111" stroke="#2a2a2a"/>
    <rect x="420" y="100" width="440" height="36" rx="10" fill="#161616" stroke="#2a2a2a"/>
    <rect x="420" y="120" width="440" height="16" fill="#161616"/>
    <text x="436" y="124" fill="#a3a3a3" font-size="13" font-weight="600" letter-spacing="0.08em">LAN</text>

    <rect x="448" y="160" width="384" height="44" rx="6" fill="#151515" stroke="#333"/>
    <text x="640" y="187" text-anchor="middle" fill="#eaeaea" font-size="14">iot-platform · MQTT</text>

    <!-- bar-core hub -->
    <rect x="448" y="224" width="384" height="250" rx="8" fill="url(#hub)" stroke="#5eead4" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="640" cy="300" r="28" fill="#5eead4" fill-opacity="0.25"/>
    <circle cx="640" cy="300" r="10" fill="#9ff5e8"/>
    <text x="640" y="252" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="600">bar-core</text>

    <g font-size="11" fill="#e8e8e8">
      <rect x="468" y="330" width="110" height="32" rx="5" fill="#121212" stroke="#3a3a3a"/>
      <text x="523" y="350" text-anchor="middle">Session</text>
      <rect x="586" y="330" width="110" height="32" rx="5" fill="#121212" stroke="#3a3a3a"/>
      <text x="641" y="350" text-anchor="middle">STT / TTS</text>
      <rect x="704" y="330" width="110" height="32" rx="5" fill="#121212" stroke="#3a3a3a"/>
      <text x="759" y="350" text-anchor="middle">Dialog</text>

      <rect x="468" y="374" width="110" height="32" rx="5" fill="#121212" stroke="#5eead4"/>
      <text x="523" y="394" text-anchor="middle">RAG</text>
      <rect x="586" y="374" width="110" height="32" rx="5" fill="#121212" stroke="#3a3a3a"/>
      <text x="641" y="394" text-anchor="middle">LLM client</text>
      <rect x="704" y="374" width="110" height="32" rx="5" fill="#121212" stroke="#3a3a3a"/>
      <text x="759" y="394" text-anchor="middle">Pour tool</text>
    </g>
    <text x="640" y="440" text-anchor="middle" fill="#8a8a8a" font-size="11">voice session · knowledge · dialog tools</text>

    <rect x="468" y="500" width="170" height="40" rx="6" fill="#151515" stroke="#333"/>
    <text x="553" y="525" text-anchor="middle" fill="#cfcfcf" font-size="13">whisper.cpp</text>
    <rect x="662" y="500" width="170" height="40" rx="6" fill="#151515" stroke="#333"/>
    <text x="747" y="525" text-anchor="middle" fill="#cfcfcf" font-size="13">Piper TTS</text>

    <!-- Cloud -->
    <rect x="900" y="100" width="340" height="520" rx="10" fill="#111111" stroke="#2a2a2a"/>
    <rect x="900" y="100" width="340" height="36" rx="10" fill="#161616" stroke="#2a2a2a"/>
    <rect x="900" y="120" width="340" height="16" fill="#161616"/>
    <text x="916" y="124" fill="#5eead4" font-size="13" font-weight="600" letter-spacing="0.08em">CLOUD</text>
    <text x="916" y="156" fill="#cfcfcf" font-size="15">OpenAI-compat</text>

    <g font-size="14" fill="#eaeaea">
      <rect x="928" y="200" width="284" height="52" rx="6" fill="#0f1f1d" stroke="#2dd4bf"/>
      <text x="1070" y="232" text-anchor="middle">Chat Completions</text>
      <rect x="928" y="272" width="284" height="52" rx="6" fill="#0f1f1d" stroke="#2dd4bf"/>
      <text x="1070" y="304" text-anchor="middle">Whisper API</text>
      <rect x="928" y="344" width="284" height="52" rx="6" fill="#0f1f1d" stroke="#2dd4bf"/>
      <text x="1070" y="376" text-anchor="middle">TTS API</text>
      <rect x="928" y="416" width="284" height="52" rx="6" fill="#0f1f1d" stroke="#2dd4bf"/>
      <text x="1070" y="448" text-anchor="middle">Embeddings</text>
    </g>
    <text x="1070" y="500" text-anchor="middle" fill="#6b6b6b" font-size="12">optional cloud voice mode</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#5eead4" stroke-width="1.5" marker-end="url(#arrCyan)">
    <path d="M380 250 C400 250, 400 182, 448 182" opacity="0.85"/>
    <path d="M380 430 C400 430, 400 300, 448 300" stroke-width="2.5" opacity="0.9"/>
  </g>
  <text x="390" y="236" fill="#5eead4" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">MQTT</text>
  <text x="386" y="418" fill="#5eead4" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">Opus UDP</text>

  <g fill="none" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75">
    <path d="M832 350 C870 350, 870 298, 928 298"/>
    <path d="M832 394 C870 394, 870 448, 928 448"/>
  </g>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a9a9a">
    <rect x="40" y="650" width="12" height="12" rx="2" fill="#e8a45a"/>
    <text x="58" y="661">Device</text>
    <rect x="130" y="650" width="12" height="12" rx="2" fill="#6b6b6b"/>
    <text x="148" y="661">LAN</text>
    <rect x="200" y="650" width="12" height="12" rx="2" fill="#2dd4bf"/>
    <text x="218" y="661">Cloud</text>
    <line x1="300" y1="656" x2="340" y2="656" stroke="#5eead4" stroke-width="2"/>
    <text x="348" y="661">control / audio</text>
    <line x1="470" y1="656" x2="510" y2="656" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="518" y="661">optional cloud</text>
  </g>
</svg>
